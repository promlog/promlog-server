spring.application.name=promlog
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}

# =========================
# OAuth - Kakao
# =========================
oauth.kakao.client-id=${KAKAO_CLIENT_ID}
oauth.kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.access-exp-seconds=${JWT_ACCESS_EXP_SECONDS:1800}
jwt.refresh-exp-seconds=${JWT_REFRESH_EXP_SECONDS:1209600}
